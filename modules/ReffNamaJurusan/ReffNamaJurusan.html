<div class="{{module_id_class}}">

        <div class="box-primary box">
            <div class="box box-primary pad">

                    <!-- Widget ID (each widget will need unique ID)-->

                        <header class="">

                                012;Nama Jurusan
                            </h2>
                        </header>

                        <!-- widget div-->
                        <div>

                            <!-- widget edit box -->
                            <div class="jarviswidget-editbox">
                                <!-- This area used as dropdown edit box -->

                            </div>

                                <div class="box">
                                </div>

                                        <tr>
                                            <th data-class="expand">No</th>
                                            <th data-class="expand">Aksi</th>

                                            <th data-class="expand">Tingkat Pendidikan</th>

<!-- Modal -->
<div id="myModal" class="modal fade" role="dialog">
    <div class="modal-dialog modal-lg">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">Tambah Data Nama Jurusan</h4>
            </div>
            <form class="form-horizontal" id="form_input">
                <input type="hidden" name="id">
                <div class="modal-body">
                    <div class="form-group nopadding" style="display: none;">
                        <label class="col-sm-3" style="margin-top: 6px;"><strong>ID</strong></label>
                        <div class="col-md-9">
                            <input type="text" class="form-control" name="id_reff_nama_jurusan" disabled>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3" style="margin-top: 6px;"><strong>Tingkat Pendidikan</strong></label>
                        <div class="col-md-9">
                            <select name="id_reff_tingkat_pendidikan" class="form-control cbTingkatPendidikan" style="width: 100%">
                                <option value="0" disabled selected>Silahkan Pilih</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3" style="margin-top: 6px;"><strong>Jurusan Pendidikan</strong></label>
                        <div class="col-md-9">
                            <!-- <input type="text" class="form-control" name="jurusan_pendidikan"> -->
                            <select name="id_reff_jurusan_pendidikan" class="form-control cbJurusanPendidikan" style="width: 100%">
                                <option value="0" disabled selected>Silahkan Pilih</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3" style="margin-top: 6px;"><strong>Kode</strong></label>
                        <div class="col-md-9">
                            <input type="text" class="form-control" name="kode">
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3" style="margin-top: 6px;"><strong>Nama Jurusan</strong></label>
                        <div class="col-md-9">
                            <input type="text" class="form-control" name="nama_jurusan">
                        </div>
                    </div>
                </div>
            </form>
            <div class="modal-footer">
                <button type="button" class="btSimpan btn btn-primary">Simpan</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
            </div>
        </div>

    </div>
</div>
