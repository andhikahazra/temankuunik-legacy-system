    td {

        position: fixed;

        background-color: rgba(202, 218, 235, 1);

        padding: 0 !important;

<div class="{{module_id_class}}">
    <div class="box box-primary">
        <div class="box-primary box">
            <div class="box box-primary pad">
                <div class="table table-modules">
                    <!-- Widget ID (each widget will need unique ID)-->
                    <div class="jarviswidget jarviswidget2 jarviswidget-color-blueDark" id="wid-id-1" data-widget-editbutton="false">

                        <header class="">
                            <span class="widget-icon"> <i class="fa fa-table"></i> </span>
                            <h2>
                                Identitas Pemberi Kerja
                            </h2>
                        </header>

                        <!-- widget div-->
                        <div>

                            <!-- widget edit box -->
                            <div class="jarviswidget-editbox">
                                <!-- This area used as dropdown edit box -->

                            </div>
                            <!-- end widget edit box -->

                            <!-- widget content -->
                            <div class="widget-body">
                                <div class="box">
                                </div>
                                <table id="datatable_fixed_column" class="table table-striped table-bordered" width="100%">
                                    <thead class="kepala">
                                        <tr>
                                            <th data-class="expand">No</th>
                                            <th data-class="expand">Aksi</th>
                                            <!-- <th data-class="expand">ID</th> -->
                                            <th data-class="expand">Nama Perusahaan</th>
                                            <th data-class="expand">Badan Usaha</th>
                                            <th data-class="expand">Lapangan Usaha</th>
                                            <th data-class="expand">Alamat</th>
                                            <th data-class="expand">No Telepon</th>
                                            <th data-class="expand">Email</th>
                                            <th data-class="expand">Kontak Person</th>
                                            <th data-class="expand">Jabatan</th>
                                        </tr>
                                    </thead>
                                    <tbody id="bodiku">
                                    </tbody>
                                </table>

                            </div>
                            <!-- end widget content -->

                        </div>
                        <!-- end widget div -->

                    </div>
                    <!-- end widget -->
                </div>
            </div>

        </div>
        <div class="overlay">
            <i class="fa fa-refresh fa-spin"></i>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="myModal" class="modal fade" role="dialog">
    <div class="modal-dialog modal-lg">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">Tambah Identitas Pemberi Kerja</h4>
            </div>
            <form class="form-horizontal" id="form_input">
                <input type="hidden" name="id">
                <div class="modal-body">
                     <div class="form-group nopadding d-none" style="display: none;">
                        <label class="col-sm-2 text-right"><strong>id_identitas_pemberikerja</strong></label>
                        <div class="col-md-10">
                            <input type="text" disabled class="form-control" name="id_identitas_pemberikerja">
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3 text-right"><strong>Nama Pemberi Kerja</strong></label>
                        <div class="col-md-7">
                            <input type="text" class="form-control" name="nama_pemberi_kerja">
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3  text-right" style="margin-top: 6px;"><strong>Badan Usaha</strong></label>
                        <div class="col-md-7">
                            <select name="id_reff_badan_usaha" class="form-control cbBadanusaha" id="cbBadanusaha" style="width: 100%">
                                <!-- <option value="0" disabled selected>Silahkan Pilih</option> -->
                            </select>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3  text-right" style="margin-top: 6px;"><strong>Lapangan Usaha</strong></label>
                        <div class="col-md-7">
                            <select name="id_reff_lapangan_usaha" class="form-control cbLapanganusaha" id="cbLapanganusaha" style="width: 100%">
                                <!-- <option value="0" disabled selected>Silahkan Pilih</option> -->
                            </select>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3  text-right" style="margin-top: 6px;"><strong>Nama Usaha</strong></label>
                        <div class="col-md-7">
                            <select name="id_reff_nama_usaha" class="form-control cbNamausaha" id="cbNamausaha" style="width: 100%">
                                <!-- <option value="0" disabled selected>Silahkan Pilih</option> -->
                            </select>
                        </div>
                    </div>
                     <div class="form-group nopadding">
                        <label class="col-sm-3 text-right"><strong>Alamat</strong></label>
                        <div class="col-md-7">
                             <textarea class="form-control" name="alamat" rows="3"></textarea>
                            <!-- data-date-format="DD/MM/YYYY" placeholder="dd/mm/yyyy" -->
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3 text-right"><strong>Provinsi</strong></label>
                       <div class="col-md-7">
                            <select name="id_reff_provinsi" class="form-control cbProvinsi" id="cbProvinsi" style="width: 100%">
                                <!-- <option value="0" disabled selected>Silahkan Pilih</option> -->
                            </select>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3 text-right"><strong>Kabupaten</strong></label>
                        <div class="col-md-7">
                            <select name="id_reff_kabupaten" class="form-control cbKabupaten" id="cbKabupaten" style="width: 100%">
                                <!-- <option value="0" disabled selected>Silahkan Pilih</option> -->
                            </select>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3  text-right" style="margin-top: 6px;"><strong>Kecamatan</strong></label>
                        <div class="col-md-7">
                            <select name="id_reff_kecamatan" class="form-control cbKecamatan" style="width: 100%">
                                <!-- <option value="0" disabled selected>Silahkan Pilih</option> -->
                            </select>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3  text-right" style="margin-top: 6px;"><strong>Kalurahan</strong></label>
                        <div class="col-md-7">
                            <select name="id_reff_desa" class="form-control cbKalurahan" style="width: 100%">
                                <!-- <option value="0" disabled selected>Silahkan Pilih</option> -->
                            </select>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3 text-right"><strong>Kode Pos</strong></label>
                        <div class="col-md-7">
                            <input type="text" class="kode_pos form-control " id="kode_pos" name="kode_pos" readonly>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3 text-right"><strong>Nomor Telp/Hp</strong></label>
                        <div class="col-md-7">
                            <input type="text" class="form-control" name="no_tlp">
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-3 text-right"><strong>Email</strong></label>
                        <div class="col-md-7">
                            <input type="text" class="form-control" name="email">
                        </div>
                    </div>
                  
                     <div class="form-group nopadding">
                        <label class="col-sm-3 text-right"><strong>Kontak Person</strong></label>
                        <div class="col-md-7">
                            <input type="text" class="form-control" name="kontak_person">
                        </div>
                    </div>
                     <div class="form-group nopadding">
                        <label class="col-sm-3 text-right"><strong>Jabatan</strong></label>
                        <div class="col-md-7">
                            <input type="text" class="form-control" name="jabatan">
                        </div>
                    </div>
                </div>
           
            <div class="modal-footer">
                <button type="submit" class="btSimpan btn btn-primary">Simpan</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
            </div>
             </form>
        </div>

    </div>
</div>
