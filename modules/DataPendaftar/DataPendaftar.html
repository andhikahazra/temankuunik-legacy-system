<!-- Modal -->
<div id="myModal" class="modal fade" role="dialog">
    <div class="modal-dialog modal-lg">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">Tambah Data</h4>
            </div>
            <form class="form-horizontal" id="form_input">
                <input type="hidden" name="id">
                <div class="modal-body">
                    <input type="hidden" class="form-control" name="id_pendaftar">
                    <div class="form-group nopadding">
                        <label class="col-sm-2"><strong>nik</strong></label>
                        <div class="col-md-10">
                            <input type="text" class="form-control" name="nik">
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-2"><strong>Nama</strong></label>
                        <div class="col-md-10">
                            <input type="text" class="form-control" name="nama">
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-2"><strong>Alamat</strong></label>
                        <div class="col-md-10">
                            <input type="text" class="form-control" name="alamat">
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-2"><strong>Email</strong></label>
                        <div class="col-md-10">
                            <input type="email" class="form-control" name="email">
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-2"><strong>No HP</strong></label>
                        <div class="col-md-10">
                            <input type="text" class="form-control" name="no_hp">
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-2"><strong>Tanggal Daftar</strong></label>
                        <div class="col-md-10">
                            <input type="date" class="form-control" name="input_date">
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-2"><strong>Punya Smartphone</strong></label>
                        <div class="col-md-10">
                            <select name="smartphone" id="smartphone" class="form-control">
                                <option value="1">Ya</option>
                                <option value="0">Tidak</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group nopadding">
                        <label class="col-sm-2"><strong>minat</strong></label>
                        <div class="col-md-10">
                            <select name="minat" id="minat" class="form-control">
                                <option value="Whatsapp">Bisnis Online - Whatsapp</option>
                                <option value="Facebook">Bisnis Online - Facebook</option>
                                <option value="Instagram">Bisnis Online - Instagram</option>
                                <option value="Marketplace">Bisnis Online - Marketplace</option>
                            </select>
                        </div>
                    </div>
                </div>
            </form>
            <div class="modal-footer">
                <button type="button" class="btSimpan btn btn-primary">Simpan</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
            </div>
        </div>

    </div>
</div>
