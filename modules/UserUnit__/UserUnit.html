<!-- Modal -->
<div id="myModal" class="modal fade" role="dialog">
    <div class="modal-dialog modal-lg">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">Tambah Data</h4>
            </div>
            <form class="form-horizontal" id="form_input">
                <input type="hidden" name="id">
                <div class="modal-body">
                    <div class="form-group nopadding" style="display: none;">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Session Id</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="session_id" disabled>
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>User Id</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="user_id">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Username</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="username">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Date</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="date">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Remote Addr</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="remote_addr">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Client Addr</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="client_addr">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Module</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="module">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Action</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="action">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Status</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="status">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Data</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="data">
                            </div>
                        </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btSimpan btn btn-primary">Simpan</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
                </div>
            </form>
        </div>

    </div>
