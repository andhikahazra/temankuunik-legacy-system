                                        </button>
                                    </div> -->

                                <figure class="highcharts-figure">
                                    <div id="linecontainer"></div>

                                    </p>
                                </figure>
                                <table id="datatable_fixed_column" class="table table-striped table-bordered" width="100%">

            </div>

        </div>
        <div class="overlay">
            <i class="fa fa-refresh fa-spin"></i>
        </div>

</div>

<!-- Modal -->
<div id="myModal" class="modal fade" role="dialog">
    <div class="modal-dialog modal-lg">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">Tambah Data</h4>
            </div>
            <form class="form-horizontal" id="form_input">
                <input type="hidden" name="id">
                <div class="modal-body">
                    <div class="form-group nopadding" style="display: none;">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Id</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="id" disabled>
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Id Tamu</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="id_tamu">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Kepentingan</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="kepentingan">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Catatan</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="Catatan">
                            </div>
                        </div><div class="form-group nopadding">
                            <label class="col-sm-2" style="margin-top: 6px;"><strong>Tgl Input</strong></label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" name="tgl_input">
                            </div>
                        </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btSimpan btn btn-primary">Simpan</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
                </div>
            </form>
        </div>

    </div>
</div>
